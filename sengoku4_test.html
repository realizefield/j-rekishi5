<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>テスト：④ 鉄砲伝来と南蛮貿易</title><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Meiryo", sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px 16px 80px; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: #2c3e8c; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 20px; text-decoration: none; }
  .back-btn:hover { background: #1e2d6b; }
  h1 { text-align: center; font-size: 22px; color: #1a1a2e; margin-bottom: 6px; }
  .unit-label { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
  .card { max-width: 720px; margin: 0 auto 20px; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); border: 1px solid #e5e8f0; }
  .q-num { font-size: 12px; color: #2c3e8c; font-weight: bold; margin-bottom: 8px; }
  .q-text { font-size: 17px; color: #1a1a2e; line-height: 1.7; margin-bottom: 18px; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice { padding: 12px 16px; border: 2px solid #dde; border-radius: 8px; cursor: pointer; font-size: 15px; color: #333; transition: all 0.15s; background: #fafafa; }
  .choice:hover { border-color: #2c3e8c; background: #f0f4ff; }
  .choice.selected { border-color: #2c3e8c; background: #e8eeff; color: #2c3e8c; font-weight: bold; }
  .choice.correct { border-color: #27ae60; background: #e8fff2; color: #1e8a4d; font-weight: bold; }
  .choice.wrong { border-color: #e74c3c; background: #fff0ef; color: #c0392b; }
  .choice.show-correct { border-color: #27ae60; background: #e8fff2; color: #1e8a4d; }
  .footer { max-width: 720px; margin: 0 auto; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .btn { padding: 12px 28px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.15s; }
  .btn-primary { background: #2c3e8c; color: #fff; box-shadow: 0 3px 0 #1a2560; }
  .btn-primary:hover { background: #1e2d6b; }
  .btn-secondary { background: #6c757d; color: #fff; box-shadow: 0 3px 0 #495057; }
  #result-screen { display: none; max-width: 720px; margin: 0 auto; text-align: center; }
  .result-card { background: #fff; border-radius: 16px; padding: 40px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border: 2px solid #e5e8f0; }
  .result-score { font-size: 72px; font-weight: bold; margin: 10px 0; }
  .result-score.pass { color: #27ae60; }
  .result-score.fail { color: #e67e22; }
  .result-msg { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
  .result-detail { font-size: 15px; color: #888; margin-bottom: 30px; }
  .confetti-piece { position: fixed; width: 10px; height: 10px; top: -10px; opacity: 0; animation: fall linear forwards; border-radius: 2px; pointer-events: none; z-index: 9999; }
  @keyframes fall { 0%{top:-10px;opacity:1;transform:rotate(0deg)} 100%{top:110vh;opacity:0.3;transform:rotate(720deg)} }

  .exp{display:none}
  .review{text-align:left;margin-top:24px}
  .rv{border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:14px;line-height:1.7;border:1px solid #ddd;background:#fafafa}
  .rv.ok{border-color:#a9d3a4;background:#f2fbf1}.rv.ng{border-color:#e8b4ac;background:#fff4f2}
  .rva{color:#555;font-size:13px;margin-top:4px}
  .btn-orange{background:#e67e22;color:#fff;box-shadow:0 3px 0 #c96a10}
</style></head><body>
<a class="back-btn" href="index.html">← 単元一覧に戻る</a>
<h1>🎯 テスト</h1><p class="unit-label">④ 鉄砲伝来と南蛮貿易（12問・合格70点）</p>
<div id="quiz-screen"><div id="questions-area"></div><div class="footer"><button class="btn btn-secondary" onclick="location.href='index.html'">中断して戻る</button><button class="btn btn-primary" id="submit-btn" onclick="submitTest()">採点する</button></div></div>
<div id="result-screen"><div class="result-card"><div id="result-msg" class="result-msg"></div><div id="result-score" class="result-score"></div><div id="result-detail" class="result-detail"></div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn btn-secondary" onclick="retryTest()">もう一度挑戦</button><button class="btn btn-orange" onclick="location.href=NEXT">次の単元へ ▶</button><button class="btn btn-primary" onclick="location.href='index.html'">単元一覧へ戻る</button></div><div id="review" class="review"></div></div></div>
<script>const UNIT_ID='sen4';const PASS_SCORE=70;const NEXT="sengoku5.html";
const questions=[{"q": "1467年に始まり、戦国時代のきっかけとなった戦いはどれですか。", "choices": ["応仁の乱", "保元の乱", "壬申の乱", "承久の乱"], "ans": 0, "exp": "応仁の乱（1467年）で幕府の力が弱まりました。"}, {"q": "下の身分の者が実力で上の者をたおす風潮を何といいますか。", "choices": ["楽市楽座", "守護請", "下剋上", "兵農分離"], "ans": 2, "exp": "下剋上が戦国時代の風潮です。"}, {"q": "戦国大名が領国を治めるために定めた独自の法を何といいますか。", "choices": ["十七条の憲法", "御成敗式目", "分国法", "武家諸法度"], "ans": 2, "exp": "分国法（家法）。例：武田氏の「甲州法度之次第」。"}, {"q": "越後（新潟県）の戦国大名はだれですか。", "choices": ["上杉謙信", "武田信玄", "毛利元就", "今川義元"], "ans": 0, "exp": "上杉謙信は越後、武田信玄は甲斐です。"}, {"q": "1543年に種子島に漂着し、鉄砲を伝えたのはどこの国の人ですか。", "choices": ["オランダ", "イギリス", "スペイン", "ポルトガル"], "ans": 3, "exp": "ポルトガル人が伝えました。"}, {"q": "鉄砲の生産地として有名な都市の組み合わせとして正しいものはどれですか。", "choices": ["長崎・平戸", "堺・国友", "江戸・大阪", "京都・奈良"], "ans": 1, "exp": "堺（大阪府）と国友（滋賀県）。"}, {"q": "鉄砲の伝来の影響として正しいものはどれですか。", "choices": ["足軽の鉄砲隊による集団戦が中心になった", "城が山の上ばかりに建てられた", "戦いが減った", "騎馬武者の一騎打ちが増えた"], "ans": 0, "exp": "足軽の鉄砲隊による集団戦が中心となり、城も丈夫なつくりになりました。"}, {"q": "南蛮貿易で日本が輸出した主なものはどれですか。", "choices": ["鉄砲", "絹織物", "銀", "生糸"], "ans": 2, "exp": "日本からは銀、中国産の生糸などは輸入品です。"}, {"q": "日本最大の銀山で、世界遺産に登録されているものはどれですか。", "choices": ["佐渡金山", "石見銀山", "足尾銅山", "生野銀山"], "ans": 1, "exp": "石見銀山（島根県）。"}, {"q": "ポルトガル人・スペイン人との貿易で栄えた港の組み合わせとして正しいものはどれですか。", "choices": ["博多・那覇", "横浜・神戸", "大阪・京都", "平戸・長崎"], "ans": 3, "exp": "平戸・長崎は南蛮貿易の港です。"}, {"q": "次のア〜ウを年代の古い順に並べたものはどれですか。　ア：ザビエルが来日　イ：鉄砲が伝わる　ウ：応仁の乱が始まる", "choices": ["ウ→ア→イ", "ウ→イ→ア", "ア→イ→ウ", "イ→ウ→ア"], "ans": 1, "exp": "1467年応仁の乱 → 1543年鉄砲 → 1549年ザビエル。"}, {"q": "戦国大名が城下町をつくった目的として最も適切なものはどれですか。", "choices": ["僧を追放するため", "貿易の関税を取るため", "外国と戦うため", "家臣や商工業者を集めて領国を支配する中心とするため"], "ans": 3, "exp": "城下町は領国の政治・経済の中心になりました。"}];
let userAnswers=new Array(questions.length).fill(-1);
function renderQuestions(){const area=document.getElementById('questions-area');area.innerHTML='';questions.forEach((q,qi)=>{const card=document.createElement('div');card.className='card';card.innerHTML='<div class="q-num">問題 '+(qi+1)+' / '+questions.length+'</div><div class="q-text"></div><div class="choices" id="choices-'+qi+'"></div><div class="exp" id="exp-'+qi+'"></div>';card.querySelector('.q-text').textContent=q.q;const ch=card.querySelector('.choices');q.choices.forEach((c,ci)=>{const d=document.createElement('div');d.className='choice';d.id='choice-'+qi+'-'+ci;d.innerHTML='<span style="font-weight:bold;margin-right:8px">'+['①','②','③','④'][ci]+'</span>';d.appendChild(document.createTextNode(c));d.onclick=()=>selectChoice(qi,ci);ch.appendChild(d);});area.appendChild(card);});}
function selectChoice(qi,ci){userAnswers[qi]=ci;document.querySelectorAll('#choices-'+qi+' .choice').forEach((el,i)=>el.classList.toggle('selected',i===ci));}
function submitTest(){let correct=0;const wrongList=[];questions.forEach((q,qi)=>{const ua=userAnswers[qi];document.querySelectorAll('#choices-'+qi+' .choice').forEach((el,ci)=>{if(ci===q.ans)el.classList.add('show-correct');if(ua===ci&&ci!==q.ans)el.classList.add('wrong');if(ua===ci&&ci===q.ans){el.classList.add('correct');}el.onclick=null;});if(ua===q.ans)correct++;else wrongList.push(qi+1);});
const score=Math.round(correct/questions.length*100);const pass=score>=PASS_SCORE;
try{const prog=JSON.parse(localStorage.getItem('gamba_progress')||'{}');prog[UNIT_ID]=prog[UNIT_ID]||{};prog[UNIT_ID].testScore=score;prog[UNIT_ID].studyDone=true;localStorage.setItem('gamba_progress',JSON.stringify(prog));}catch(e){}
document.getElementById('quiz-screen').style.display='none';const rs=document.getElementById('result-screen');rs.style.display='block';
const se=document.getElementById('result-score');se.textContent=score+'点';se.className='result-score '+(pass?'pass':'fail');
document.getElementById('result-msg').textContent=pass?'🎉 合格！':'😅 おしい！もう一度解説を読んでみよう';
document.getElementById('result-detail').textContent=correct+' / '+questions.length+' 問正解（合格ライン：'+PASS_SCORE+'点）'+(wrongList.length?'　まちがえた問題：'+wrongList.join('、')+'番':'');
const rev=document.getElementById('review');rev.innerHTML='';questions.forEach((q,qi)=>{const ok=userAnswers[qi]===q.ans;const d=document.createElement('div');d.className='rv '+(ok?'ok':'ng');d.innerHTML='<b>問'+(qi+1)+(ok?' ○':' ×')+'</b>　';d.appendChild(document.createTextNode(q.q));const a=document.createElement('div');a.className='rva';a.textContent='答え：'+['①','②','③','④'][q.ans]+' '+q.choices[q.ans]+'　／　'+q.exp;d.appendChild(a);rev.appendChild(d);});
if(pass)launchConfetti();window.scrollTo(0,0);}
function retryTest(){userAnswers=new Array(questions.length).fill(-1);document.getElementById('result-screen').style.display='none';document.getElementById('quiz-screen').style.display='block';renderQuestions();window.scrollTo(0,0);}
function launchConfetti(){const colors=['#f43f5e','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6'];for(let i=0;i<80;i++){setTimeout(()=>{const el=document.createElement('div');el.className='confetti-piece';el.style.left=Math.random()*100+'vw';el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.animationDuration=(1.5+Math.random()*2)+'s';el.style.width=(6+Math.random()*8)+'px';el.style.height=(6+Math.random()*8)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),4000);},i*30);}}
renderQuestions();
</script></body></html>
